name: Build release artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build portable package and installer
        shell: powershell
        run: .\release.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Skrinshoter-win-x64
          if-no-files-found: error
          path: |
            artifacts/Skrinshoter-portable-win-x64.zip
            artifacts/Skrinshoter-setup-win-x64.exe
            artifacts/Skrinshoter-source.zip
            artifacts/SHA256SUMS.txt

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            'artifacts/Skrinshoter-portable-win-x64.zip',
            'artifacts/Skrinshoter-setup-win-x64.exe',
            'artifacts/Skrinshoter-source.zip',
            'artifacts/SHA256SUMS.txt'
          )
          cmd /c "gh release view $tag >nul 2>&1"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Uploading release assets with clobber..."
            gh release upload $tag @files --clobber
          } else {
            Write-Host "Creating release $tag..."
            gh release create $tag @files --generate-notes --title "Skrinshoter $tag"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create or upload release assets (exit code $LASTEXITCODE)."
          }
