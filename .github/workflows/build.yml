name: Build release artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build portable package and installer
        shell: powershell
        run: .\release.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Skrinshoter-win-x64
          if-no-files-found: error
          path: |
            artifacts/Skrinshoter-portable-win-x64.zip
            artifacts/Skrinshoter-setup-win-x64.exe
            artifacts/Skrinshoter-source.zip
            artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/Skrinshoter-portable-win-x64.zip
          artifacts/Skrinshoter-setup-win-x64.exe
          artifacts/Skrinshoter-source.zip
          artifacts/SHA256SUMS.txt
          --generate-notes
          --title "Skrinshoter ${{ github.ref_name }}"
          --clobber
